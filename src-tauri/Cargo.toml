[package]
name = "EyeProtection"
version = "0.0.1"
description = "Eye Protection App (Slint)"
authors = ["You"]
edition = "2021"

[dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
